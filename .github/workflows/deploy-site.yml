name: Deploy site

# Publishes the website to Cloudflare Pages whenever something the site is built from changes on main.
# Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (see docs/deploy.md); without the
# token it still builds the site, then warns instead of deploying.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - src/**
      - public/**
      - vite.site.config.ts
      - wrangler.toml
      - package-lock.json
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run site:build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN isn't set, so the site was built but not deployed. See docs/deploy.md."
            exit 0
          fi
          npx --yes wrangler@4 pages deploy --branch main
