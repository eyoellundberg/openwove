name: Deploy site

# Publishes the website to Cloudflare Pages whenever something the site is built from changes on main.
# Needs the CLOUDFLARE_API_TOKEN secret (see docs/deploy.md); without it, this explains and stops.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - src/**
      - public/**
      - vite.site.config.ts
      - wrangler.toml
      - package-lock.json
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check the Cloudflare token is set
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN isn't set, so the site wasn't deployed. See docs/deploy.md."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.token.outputs.present == 'true'

      - uses: actions/setup-node@v7
        if: steps.token.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        if: steps.token.outputs.present == 'true'

      - run: npm run site:build
        if: steps.token.outputs.present == 'true'

      - name: Deploy to Cloudflare Pages
        if: steps.token.outputs.present == 'true'
        run: npx --yes wrangler@4 pages deploy --branch main
